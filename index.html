<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6b4a2b">
<meta name="description" content="A touch-friendly browser tribute to the physics puzzle game Cut the Rope. Swipe to cut ropes and feed the candy to Om Nom.">
<title>Cut the Rope — Web Tribute</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='11' fill='%237bc043'/%3E%3Ccircle cx='12' cy='11' r='4' fill='%23fff'/%3E%3Ccircle cx='20' cy='11' r='4' fill='%23fff'/%3E%3Ccircle cx='12' cy='11' r='2' fill='%23222'/%3E%3Ccircle cx='20' cy='11' r='2' fill='%23222'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <button id="btn-menu" class="hud-btn" aria-label="Level menu">&#9776;</button>
    <div id="level-label">Box 1 &mdash; 1</div>
    <button id="btn-restart" class="hud-btn" aria-label="Restart level">&#8635;</button>
  </div>

  <div id="overlay">
    <div id="title-screen" class="screen">
      <h1>Cut the Rope</h1>
      <p class="subtitle">a physics puzzle web tribute</p>
      <div class="omnom-badge" aria-hidden="true"></div>
      <button id="btn-play" class="big-btn">Play</button>
      <button id="btn-levels" class="text-btn">Choose a level</button>
      <p class="credit">Fan project. Cut the Rope &amp; Om Nom are trademarks of ZeptoLab.<br>No original art or code from the game is used.</p>
    </div>

    <div id="level-select" class="screen hidden">
      <h2>Levels</h2>
      <div id="level-grid"></div>
      <button id="btn-back" class="text-btn">Back</button>
    </div>

    <div id="result-screen" class="screen hidden">
      <h2 id="result-title">Yum!</h2>
      <div id="result-stars" class="result-stars">
        <span class="rstar">&#9733;</span><span class="rstar">&#9733;</span><span class="rstar">&#9733;</span>
      </div>
      <p id="result-msg"></p>
      <div class="result-buttons">
        <button id="btn-result-retry" class="text-btn">Retry</button>
        <button id="btn-result-next" class="big-btn">Next</button>
      </div>
    </div>
  </div>

  <div id="hint" class="hidden"></div>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
